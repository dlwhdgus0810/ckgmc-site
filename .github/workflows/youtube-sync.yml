# 매주 유튜브 채널의 새 영상을 영상 설교 게시판에 자동으로 추가합니다.
# 새 글이 커밋되면 Cloudflare Pages 가 사이트를 다시 빌드합니다.
name: 유튜브 설교 자동 등록
on:
  schedule:
    - cron: '0 13 * * 1'   # 매주 월요일 13:00 UTC (캔자스 오전 7~8시)
  workflow_dispatch:        # Actions 탭에서 수동 실행도 가능
permissions:
  contents: write
concurrency:
  group: youtube-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run import:youtube
      - name: 새 영상이 있으면 커밋
        run: |
          git add src/content/posts/sermons
          if git diff --cached --quiet; then
            echo "새 영상이 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto-add YouTube sermons"
          git push
