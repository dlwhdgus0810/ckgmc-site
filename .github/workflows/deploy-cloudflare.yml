# main 브랜치에 커밋이 생기면(관리 화면 저장, 유튜브 자동 등록, 직접 push) 빌드해서 Cloudflare Workers 에 배포합니다.
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare 대시보드 → My Profile → API Tokens → "Edit Cloudflare Workers" 템플릿
#   CLOUDFLARE_ACCOUNT_ID — 대시보드 Workers & Pages 우측의 Account ID
name: Deploy to Cloudflare Workers
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
