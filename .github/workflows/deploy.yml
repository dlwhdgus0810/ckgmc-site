# GitHub Pages 수동 배포 (예비용). 기본 배포는 Cloudflare Pages 가 GitHub push 를 감지해 자동으로 합니다.
# 사용하려면 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 두고 Actions 탭에서 이 워크플로를 실행하세요.
name: Deploy to GitHub Pages (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
