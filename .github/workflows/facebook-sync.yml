# 페이스북 페이지의 새 사진 글을 "우리 교회 이야기"에 자동으로 추가합니다.
# - 웹훅을 설정했으면: 글을 올리는 순간 Meta 가 사이트(/hooks/facebook)에 알리고, 사이트가 이 워크플로를 바로 실행합니다 (보통 3~4분 뒤 사이트에 나옴).
# - 15분마다 도는 확인은 웹훅이 놓친 글을 위한 안전망입니다 (GitHub 예약 실행은 늦어지거나 건너뛸 수 있습니다).
# 토큰 만료 같은 오류는 하루 한 번(아래 첫 번째 일정)과 수동 실행에서만 "실패"로 표시합니다 — 글마다, 15분마다 실패 메일이 오지 않게.
# 저장소 Secret `FACEBOOK_PAGE_TOKEN`(페이지 액세스 토큰)이 있어야 동작합니다. 없으면 아무것도 하지 않고 끝납니다.
# 새 글을 커밋한 뒤 배포 워크플로(deploy-cloudflare.yml)를 직접 실행합니다 (유튜브 자동 등록과 같은 이유).
name: 페이스북 이야기 자동 등록
on:
  schedule:
    - cron: '23 14 * * *'   # 매일 14:23 UTC (캔자스 오전 8~9시) — 오류가 있으면 이 실행만 실패로 표시
    - cron: '*/15 * * * *'  # 15분마다 — 오류가 있어도 조용히 넘어감
  repository_dispatch:       # 페이스북 웹훅을 받은 사이트가 실행 (src/pages/hooks/facebook.ts) — 오류가 있어도 조용히 넘어감
    types: [facebook-post]
  workflow_dispatch:         # Actions 탭에서 수동 실행도 가능
    inputs:
      since:
        description: '이 날짜 뒤에 올린 글부터 다시 확인 (예: 2026-10-01). 비우면 마지막으로 확인한 글 뒤부터'
        required: false
        type: string
      refresh_images:
        description: '이미 가져온 글의 사진을 큰 원본으로 다시 받기 (위 날짜와 함께 사용)'
        required: false
        type: boolean
        default: false
permissions:
  contents: write   # 새 이야기 커밋
  actions: write    # 배포 워크플로 실행
concurrency:
  group: facebook-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 일부 글만 실패해도 받은 글은 커밋하도록 여기서는 멈추지 않고, 맨 끝에서 실패로 표시합니다
      - name: 페이스북 새 글 가져오기
        id: import
        continue-on-error: true
        run: npm run import:facebook
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          # 15분마다 도는 실행과 웹훅 실행에서는 오류를 기록만 하고 성공으로 끝냅니다 (하루 한 번 실행과 수동 실행은 실패로 표시)
          FACEBOOK_LENIENT: ${{ (github.event_name == 'repository_dispatch' || github.event.schedule == '*/15 * * * *') && '1' || '' }}
          # 수동 실행 때 넣은 값 (명령줄에 직접 끼워 넣지 않고 환경 변수로 넘깁니다)
          FACEBOOK_SINCE: ${{ inputs.since }}
          FACEBOOK_REFRESH_IMAGES: ${{ inputs.refresh_images && '1' || '' }}
      - name: 새 이야기가 있으면 커밋
        id: commit
        run: |
          git add src/content/stories public/images/stories
          # 기록 파일은 글을 한 번이라도 확인한 뒤에야 생깁니다. 없는 파일을 git add 하면 오류로 끝나므로 있을 때만 담습니다
          if [ -f scripts/import/facebook-state.json ]; then git add scripts/import/facebook-state.json; fi
          if git diff --cached --quiet; then
            echo "새 이야기가 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto-add Facebook stories"
          # 그 사이 다른 커밋(관리 화면 저장 등)이 올라왔어도 밀어 넣을 수 있게
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: 새 이야기를 사이트에 배포
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run deploy-cloudflare.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 가져오기 실패 알림
        if: steps.import.outcome == 'failure'
        run: |
          echo "::error::페이스북 글을 가져오지 못했습니다. 위 '페이스북 새 글 가져오기' 단계의 기록을 확인하세요 (토큰 만료가 가장 흔한 원인입니다)."
          exit 1
